apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-model-registry
  labels:
    app: ml-model-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-model-registry
  template:
    metadata:
      labels:
        app: ml-model-registry
    spec:
      containers:
        - name: api
          image: ml-model-registry:local
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ml-model-registry
spec:
  selector:
    app: ml-model-registry
  ports:
    - port: 80
      targetPort: 8080
